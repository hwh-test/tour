<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국내 지역별 관광 정보</title>
  
  <style>
    /* ===================================================
       [STYLE] UI / 레이아웃 스타일
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 1rem;
    }

    /* 컨트롤 영역 (선택창) */
    .control-panel {
      margin-top: 24px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #334155;
    }

    select {
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 500;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background-color: #fff;
      color: #1e293b;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .status-badge {
      font-size: 0.85rem;
      color: #64748b;
      min-height: 20px;
    }

    /* 관광 명소 목록 뷰 */
    .tour-view {
      margin-top: 20px;
      transition: opacity 0.3s ease;
    }

    /* 지침: 저장된 정보가 없으면 화면을 아예 숨김 */
    .tour-view.hidden {
      display: none !important;
    }

    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }

    .view-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-count {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    /* 카드 그리드 */
    .tour-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      background-color: #e2e8f0;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-address {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: auto;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🇰🇷 지역별 관광 정보 서비스</h1>
      <p class="subtitle">공공데이터 TourAPI와 Firebase Firestore를 연동한 관광지 탐색기</p>

      <div class="control-panel">
        <div class="select-group">
          <label for="area-select">조회 지역</label>
          <select id="area-select">
            <option value="">-- 지역을 선택하세요 --</option>
            <option value="1">서울</option>
            <option value="2">인천</option>
            <option value="3">대전</option>
            <option value="4">대구</option>
            <option value="5">광주</option>
            <option value="6">부산</option>
            <option value="7">울산</option>
            <option value="8">세종특별자치시</option>
            <option value="31">경기도</option>
            <option value="32">강원특별자치도</option>
            <option value="33">충청북도</option>
            <option value="34">충청남도</option>
            <option value="35">전북특별자치도</option>
            <option value="36">전라남도</option>
            <option value="37">경상북도</option>
            <option value="38">경상남도</option>
            <option value="39">제주도</option>
          </select>
        </div>
        <div id="status-badge" class="status-badge">데이터베이스 연결 확인 중...</div>
      </div>
    </header>

    <!-- 관광 목록 뷰: 초기 로딩 시 Firebase에 저장된 데이터가 없으면 계속 hidden 상태 유지 -->
    <main id="tour-view" class="tour-view hidden">
      <div class="view-header">
        <h2 id="view-title" class="view-title">관광 명소</h2>
        <span id="badge-count" class="badge-count">0개 발견</span>
      </div>
      <div id="tour-list" class="tour-grid"></div>
    </main>
  </div>

  <!-- ===================================================
       [JAVASCRIPT] Firebase 및 공공데이터 연동 로직
       =================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // -----------------------------------------------------------------
    // 1. 설정 및 상수 정의 (발급받은 키를 이곳에 입력하세요)
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBXugQIZBQDh_R6_IKfSsk8Qre9kHJB7B8",
      authDomain: "my-project-e3104.firebaseapp.com",
      projectId: "my-project-e3104",
      storageBucket: "my-project-e3104.firebasestorage.app",
      messagingSenderId: "824249211212",
      appId: "1:824249211212:web:420a6d1f63bd8ce9e6d7e9"
    };

    
    // 공공데이터포털 일반 인증키 (Decoding 키 권장)
    const TOUR_API_KEY = "b45e02c4dfb2b0d18fee5d4bbbca349b9b6f6f70ab819215d9cfe6184588e94a";
    const TOUR_API_URL = "http://apis.data.go.kr/B551011/KorService2/areaBasedList2";

    // -----------------------------------------------------------------
    // 2. 초기화 및 전역 인스턴스
    // -----------------------------------------------------------------
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM 요소
    const areaSelect = document.getElementById("area-select");
    const tourView = document.getElementById("tour-view");
    const tourList = document.getElementById("tour-list");
    const viewTitle = document.getElementById("view-title");
    const badgeCount = document.getElementById("badge-count");
    const statusBadge = document.getElementById("status-badge");

    /**
     * 방문자별 브라우저 고유 식별자 취득 (익명 사용자 상태 보관용)
     */
    function getUserId() {
      let uid = localStorage.getItem("tour_anonymous_uid");
      if (!uid) {
        uid = "usr_" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("tour_anonymous_uid", uid);
      }
      return uid;
    }
    const currentUserId = getUserId();

    // -----------------------------------------------------------------
    // 3. Firebase 서비스 모듈 (데이터 읽기 / 쓰기)
    // -----------------------------------------------------------------
    const FirebaseService = {
      // 최근 저장된 지역 정보 조회
      async getSavedRegion(userId) {
        const userDocRef = doc(db, "user_tour_history", userId);
        const docSnap = await getDoc(userDocRef);
        if (docSnap.exists()) {
          return docSnap.data();
        }
        return null;
      },

      // 선택한 지역 정보 갱신(업데이트)
      async updateSelectedRegion(userId, areaCode, areaName) {
        const userDocRef = doc(db, "user_tour_history", userId);
        await setDoc(userDocRef, {
          areaCode,
          areaName,
          updatedAt: serverTimestamp()
        }, { merge: true });
      }
    };

    // -----------------------------------------------------------------
    // 4. TourAPI 서비스 모듈 (공공데이터 조회)
    // -----------------------------------------------------------------
    const TourApiService = {
      async fetchPlacesByArea(areaCode) {
        const params = new URLSearchParams({
          serviceKey: TOUR_API_KEY,
          numOfRows: "16",
          pageNo: "1",
          MobileOS: "ETC",
          MobileApp: "TourWeb",
          _type: "json",
          arrange: "O", // 대표 이미지가 있는 명소 우선 정렬
          areaCode: areaCode
        });

        const res = await fetch(`${TOUR_API_URL}?${params.toString()}`);
        if (!res.ok) {
          throw new Error(`API 통신 실패 (상태 코드: ${res.status})`);
        }

        const data = await res.json();
        const items = data.response?.body?.items?.item;

        if (!items) return [];
        return Array.isArray(items) ? items : [items];
      }
    };

    // -----------------------------------------------------------------
    // 5. UI 렌더링 모듈
    // -----------------------------------------------------------------
    const ViewRenderer = {
      showLoading(msg) {
        statusBadge.textContent = msg;
      },

      hideTourView() {
        tourView.classList.add("hidden");
      },

      showTourView() {
        tourView.classList.remove("hidden");
      },

      renderList(items, areaName) {
        viewTitle.textContent = `${areaName} 명소`;
        badgeCount.textContent = `${items.length}개 발견`;
        tourList.innerHTML = "";

        if (items.length === 0) {
          tourList.innerHTML = `<div class="empty-state">해당 지역에 등록된 관광정보가 없습니다.</div>`;
          this.showTourView();
          return;
        }

        const fallbackImg = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&auto=format&fit=crop&q=60";

        items.forEach(place => {
          const card = document.createElement("article");
          card.className = "card";
          
          const imgUrl = place.firstimage || place.firstimage2 || fallbackImg;
          const title = place.title || "명칭 미확인";
          const addr = place.addr1 || "주소 정보가 제공되지 않습니다.";

          card.innerHTML = `
            <div class="card-img-wrapper">
              <img class="card-img" src="${imgUrl}" alt="${title}" loading="lazy" />
            </div>
            <div class="card-body">
              <h3 class="card-title" title="${title}">${title}</h3>
              <p class="card-address">${addr}</p>
            </div>
          `;
          tourList.appendChild(card);
        });

        this.showTourView();
      }
    };

    // -----------------------------------------------------------------
    // 6. 이벤트 컨트롤러 & 초기 로딩 라이프사이클
    // -----------------------------------------------------------------
    
    // 지역 선택 시 트리거
    areaSelect.addEventListener("change", async (event) => {
      const areaCode = event.target.value;
      const areaName = event.target.options[event.target.selectedIndex].text;

      // 1. 기본 빈 선택인 경우 화면 숨김
      if (!areaCode) {
        ViewRenderer.hideTourView();
        statusBadge.textContent = "지역을 선택해주세요.";
        return;
      }

      try {
        ViewRenderer.showLoading(`'${areaName}' 데이터 조회 및 동기화 중...`);

        // 2. 공공데이터 API 조회 & 하단 목록 뷰 표출
        const places = await TourApiService.fetchPlacesByArea(areaCode);
        ViewRenderer.renderList(places, areaName);

        // 3. 사용자가 선택한 지역 정보를 Firebase에 저장/갱신
        await FirebaseService.updateSelectedRegion(currentUserId, areaCode, areaName);
        statusBadge.textContent = `최근 선택(${areaName})이 Firebase에 업데이트되었습니다.`;
      } catch (err) {
        console.error("처리 중 오류 발생:", err);
        statusBadge.textContent = "데이터를 처리하는 중 오류가 발생했습니다. 키 설정을 확인하세요.";
      }
    });

    // 웹페이지 첫 로딩 시 실행
    async function init() {
      try {
        ViewRenderer.showLoading("저장된 최근 활동 불러오는 중...");

        // 1. Firebase에서 저장된 지역 정보 조회
        const savedData = await FirebaseService.getSavedRegion(currentUserId);

        // 2. 저장된 지역 정보가 있는지 판단
        if (savedData && savedData.areaCode) {
          // 저장된 정보가 있다면 셀렉트 박스 동기화 후 목록 표출
          areaSelect.value = savedData.areaCode;
          ViewRenderer.showLoading(`최근 선택했던 '${savedData.areaName}' 정보를 가져옵니다.`);

          const places = await TourApiService.fetchPlacesByArea(savedData.areaCode);
          ViewRenderer.renderList(places, savedData.areaName);
          statusBadge.textContent = `이전 기록인 '${savedData.areaName}'을 불러왔습니다.`;
        } else {
          // 저장된 정보가 없다면 지침에 따라 목록 뷰를 완전히 숨김
          ViewRenderer.hideTourView();
          statusBadge.textContent = "저장된 지역 기록이 없습니다. 지역을 선택해주세요.";
        }
      } catch (err) {
        console.error("초기 데이터 로딩 에러:", err);
        ViewRenderer.hideTourView();
        statusBadge.textContent = "기록을 불러오지 못했습니다. Firestore 보안 규칙을 확인하세요.";
      }
    }

    // 앱 시작
    init();
  </script>
</body>
</html>
